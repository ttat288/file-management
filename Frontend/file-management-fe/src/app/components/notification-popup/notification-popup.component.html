<div class="overlay" (click)="cancel.emit()"></div>
<div class="panel">
  <div class="header">
    <div class="title">{{ title }}</div>
  </div>
  <div class="body">{{ message }}</div>
  <div class="footer">
    <button *ngIf="showCancel" class="btn" type="button" (click)="cancel.emit()">
      {{ cancelText }}
    </button>
    <button class="btn" [ngClass]="confirmButtonClass" type="button" (click)="confirm.emit()">
      {{ confirmText }}
    </button>
  </div>
</div>
